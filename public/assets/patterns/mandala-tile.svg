<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <g fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.6">
    <!-- Outer ring -->
    <circle cx="60" cy="60" r="55"/>
    <circle cx="60" cy="60" r="45"/>
    <circle cx="60" cy="60" r="30"/>
    <circle cx="60" cy="60" r="15"/>
    <!-- 8 spokes -->
    <line x1="60" y1="5"  x2="60" y2="115"/>
    <line x1="5"  y1="60" x2="115" y2="60"/>
    <line x1="21" y1="21" x2="99" y2="99"/>
    <line x1="99" y1="21" x2="21" y2="99"/>
    <!-- Petal hints -->
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(0 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(45 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(90 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(135 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(180 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(225 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(270 60 60)"/>
    <ellipse cx="60" cy="32" rx="5"  ry="12" transform="rotate(315 60 60)"/>
  </g>
</svg>
